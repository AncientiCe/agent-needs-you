# Release: when a version tag is pushed, publish a GitHub release whose notes
# are that version's CHANGELOG.md section, copied verbatim, with the firmware
# attached: a full image for flashing a new board over USB, and the app image
# for updating a running board over Wi-Fi. Built without secrets.h, so a new
# board starts in setup.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub release from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract this version's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section; add it before tagging."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Build firmware
        run: |
          pip install platformio
          pio run
          b=.pio/build/tdisplay-s3-amoled
          p=~/.platformio/packages
          name="agent-needs-you-${GITHUB_REF_NAME}"
          python "$p/tool-esptoolpy/esptool.py" --chip esp32s3 merge_bin -o "$name-full.bin" \
            0x0 "$b/bootloader.bin" 0x8000 "$b/partitions.bin" \
            0xe000 "$p/framework-arduinoespressif32/tools/partitions/boot_app0.bin" 0x10000 "$b/firmware.bin"
          cp "$b/firmware.bin" "$name-update.bin"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" agent-needs-you-*.bin --clobber
