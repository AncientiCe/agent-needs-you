; LilyGO T-Display S3 AMOLED (ESP32-S3R8, 16MB flash, 8MB OPI PSRAM)
[platformio]
default_envs = tdisplay-s3-amoled

[env:tdisplay-s3-amoled]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    bblanchon/ArduinoJson@7.2.1
    ; only for its fonts, drawn through Arduino_GFX
    olikraus/U8g2@2.36.17

; Same firmware, flashed over Wi-Fi to a board that is already running it:
;   ANU_HOST=<board-ip> ANU_UPDATE_PASSWORD=<password> pio run -e ota -t upload
[env:ota]
extends = env:tdisplay-s3-amoled
upload_protocol = custom
upload_command = curl -fsS --max-time 180 -H "X-Update-Password: ${sysenv.ANU_UPDATE_PASSWORD}" --data-binary @$SOURCE http://${sysenv.ANU_HOST}/update
